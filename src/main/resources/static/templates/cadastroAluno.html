<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Aluno</title>
    </head>
<body>
    
    <h2>Formulário de Aluno</h2>

    <form th:action="@{/alunos/salvar}" th:object="${aluno}" method="POST">
        
        <input type="hidden" th:field="*{id_aluno}" />

        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome_aluno}" required />
        </div>
        <br>
        
        <div>
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" th:field="*{cpf_aluno}" required />
        </div>
        <br>

        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" th:field="*{email_aluno}" required />
        </div>
        <br>

        <button type="submit">Salvar Aluno</button>
    </form>

    <br>
    <a th:href="@{/alunos/listar}">Voltar para a Listagem</a>

</body>
</html>
