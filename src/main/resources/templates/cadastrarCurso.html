<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Curso</title>
</head>
<body>

    <h2>Formulário de Curso</h2>

    <form th:action="@{/Curso/salvarC}" th:object="${curso}" method="POST">
        
        <input type="hidden" th:field="*{id}" />

        <div>
            <label for="nome_curso">Nome do Curso:</label>
            <input type="text" id="nome_curso" th:field="*{nome_curso}" required />
        </div>
        <br>
        
        <div>
            <label for="carga_horaria">Carga Horária:</label>
            <input type="number" id="carga_horaria" th:field="*{cargaHoraria}" required />
        </div>
        <br>

        <div>
            <label for="descricao">Descrição (Ementa):</label>
            <input id="descricao" th:field="*{descricaoCurso}" size="40" required />
        </div>
        <br>

        <button type="submit">Salvar Curso</button>
    </form>

    <br>
    <a th:href="@{/Curso/listarCurso}">Voltar para a Listagem</a>

</body>
</html>
