<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
<body>
    
    <h2>Formulário de Aluno</h2>

    <form th:action="@{/aluno/salvar}" th:object="${aluno}" method="POST">
        
        <input type="hidden" th:field="*{id_aluno}" />

          <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome_aluno}" required />
        </div>
        <br>
        
        <div>
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" th:field="*{cpf_aluno}" required />
        </div>
        <br>

        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" th:field="*{email_aluno}" required />
        </div>
        <br>

        <button type="submit">Salvar Aluno</button>
    </form>

    <br>
    <a th:href="@{/aluno/listarTodos}">Voltar para a Listagem</a>

</body>
</html>
